name: FPS.ms Multi-Account Auto Renew

on:
  schedule:
    # 每天两次非整点执行（UTC 02:17 & 14:29 => 北京时间 10:17 & 22:29）
    - cron: "17 2 * * *"
    - cron: "29 14 * * *"
  workflow_dispatch:
    inputs:
      skip_jitter:
        description: "手动测试时跳过长随机等待（true=快速执行，false=完整防风控间隔）"
        required: false
        default: "true"
        type: boolean

jobs:
  renew:
    runs-on: ubuntu-latest
    # 账号较多时请按需调大超时时间（最大 360 分钟）
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (xvfb & sing-box)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb curl tar
          SINGBOX_VER="1.11.4"
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/sing-box-${SINGBOX_VER}-linux-amd64.tar.gz" -o /tmp/sing-box.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo mv /tmp/sing-box-${SINGBOX_VER}-linux-amd64/sing-box /usr/local/bin/sing-box
          sudo chmod +x /usr/local/bin/sing-box
          sing-box version

      - name: Install Python dependencies & Patchright Chromium
        run: |
          pip install -r requirements.txt
          patchright install chromium
          patchright install-deps chromium

      - name: Run Multi-Account Renew Script
        env:
          FPS_ACCOUNTS: ${{ secrets.FPS_ACCOUNTS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 账号之间随机间隔秒数（默认 120~360 秒，即 2~6 分钟）
          ACCOUNT_GAP_MIN: "120"
          ACCOUNT_GAP_MAX: "360"
          SKIP_JITTER: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_jitter || 'false' }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python renew.py
